<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>This page is not here | Jorge Luis Borges</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f9f7f1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --background: #f9f7f1;
        --foreground: #292421;
        --faint: #29242194;
      }

      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        background: var(--background);
        color: var(--foreground);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(1.02rem, 0.94vw, 1.16rem);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      #fragments,
      #fragments-light {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 0;
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: safe center;
        align-items: center;
        padding: 8rem 1.25rem;
      }

      article {
        width: 100%;
        max-width: 40rem;
        text-align: justify;
      }

      h1 {
        font: inherit;
        font-weight: inherit;
        margin: 0 0 1.5rem;
      }

      p {
        margin: 0 0 1.5rem;
      }

      p:last-child {
        margin-bottom: 0;
      }

      .note {
        font-size: 0.85em;
        color: var(--faint);
      }

      a {
        color: inherit;
        text-decoration-line: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.12em;
      }

      a:hover {
        text-decoration-thickness: 1.5px;
      }

      @media (max-width: 640px) {
        main {
          justify-content: flex-start;
          padding-top: 6rem;
          padding-bottom: 6rem;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="fragments" aria-hidden="true"></canvas>
    <canvas id="fragments-light" aria-hidden="true"></canvas>
    <main>
      <article>
        <h1>This page is not here</h1>
        <p>
          There is nothing at this address. It may have been mistyped, or it was never
          part of the site.
        </p>
        <p class="note"><a href="/">Back to the walk</a>.</p>
      </article>
    </main>
    <script type="module" src="/background.js"></script>
  </body>
</html>
